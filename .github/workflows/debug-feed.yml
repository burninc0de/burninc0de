name: debug feed
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: curl feed with rss-parser
        run: |
          echo "=== rss-parser UA ==="
          curl -sv -H "User-Agent: rss-parser" -H "Accept: application/rss+xml" https://andreklein.net/feed/ -o /tmp/out.txt 2>&1 | head -n 100
          echo "CODE:"; curl -s -o /dev/null -w "%{http_code}\n" -H "User-Agent: rss-parser" https://andreklein.net/feed/
          echo "BODY head:"; head -c 1000 /tmp/out.txt; echo
      - name: curl feed with browser UA
        run: |
          echo "=== browser UA ==="
          curl -sv -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" https://andreklein.net/feed/ -o /tmp/out2.txt 2>&1 | head -n 100
          echo "CODE:"; curl -s -o /dev/null -w "%{http_code}\n" -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" https://andreklein.net/feed/
          head -c 1000 /tmp/out2.txt; echo
      - name: curl feed with full browser headers
        run: |
          echo "=== full headers ==="
          curl -sv -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: en-US,en;q=0.9" -H "Accept-Encoding: gzip" https://andreklein.net/feed/ -o /tmp/out3.txt 2>&1 | head -n 150
          echo "CODE:"; curl -s -o /dev/null -w "%{http_code}\n" -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" https://andreklein.net/feed/
          head -c 1000 /tmp/out3.txt; echo
      - name: curl wp-json
        run: |
          echo "=== wp-json rss-parser ==="
          curl -sv -H "User-Agent: rss-parser" https://andreklein.net/wp-json/wp/v2/posts?per_page=3 2>&1 | head -n 100
          echo "CODE:"; curl -s -o /dev/null -w "%{http_code}\n" -H "User-Agent: rss-parser" "https://andreklein.net/wp-json/wp/v2/posts?per_page=3"
          echo "=== wp-json browser ==="
          curl -sv -H "User-Agent: Mozilla/5.0" https://andreklein.net/wp-json/wp/v2/posts?per_page=3 2>&1 | head -n 100
          echo "CODE:"; curl -s -o /dev/null -w "%{http_code}\n" -H "User-Agent: Mozilla/5.0" "https://andreklein.net/wp-json/wp/v2/posts?per_page=3"
      - name: check ray and cf headers
        run: |
          curl -sI -H "User-Agent: rss-parser" https://andreklein.net/feed/ | cat
          echo "--- browser ---"
          curl -sI -H "User-Agent: Mozilla/5.0" https://andreklein.net/feed/ | cat
